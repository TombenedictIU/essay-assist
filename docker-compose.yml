services:
  backend:
    build: ./backend
    container_name: evalqueue-backend
    environment:
      # Set in a .env file next to this file (see .env.example). If empty, a random
      # per-process secret is generated and sessions end when the container restarts.
      JWT_SECRET: ${JWT_SECRET:-}
      # Instructor registration is disabled unless an invite code is configured.
      INSTRUCTOR_INVITE_CODE: ${INSTRUCTOR_INVITE_CODE:-}
      PORT: 4000
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    ports:
      - "4000:4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: evalqueue-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
